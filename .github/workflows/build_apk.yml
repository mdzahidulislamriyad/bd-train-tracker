name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BD Train Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Initialize Android Scaffolding
        run: |
          cd mobile_app
          rm -rf android
          flutter create --org com.bdtraintracker --project-name bd_train_tracker --platforms=android .
          python3 configure_android.py

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release --no-tree-shake-icons > ../build_output.txt 2>&1 || (
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B debug-logs
            git add -f build_output.txt
            git commit -m "chore: save build debug logs"
            git push -f origin debug-logs
            tail -n 60 build_output.txt
            exit 1
          )

      - name: Rename Output APK
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/BDTrainTracker-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDTrainTracker-v1.0-APK
          path: mobile_app/build/app/outputs/flutter-apk/BDTrainTracker-v1.0.apk
          if-no-files-found: error
          retention-days: 30
