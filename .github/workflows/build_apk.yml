name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows 1-click manual build anytime from GitHub website

jobs:
  build:
    name: Build BD Train Tracker APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: 🚀 Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release --no-tree-shake-icons

      - name: 💾 Rename APK
        run: |
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/BDTrainTracker-v1.0.apk

      - name: 📤 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: BDTrainTracker-v1.0-APK
          path: mobile_app/build/app/outputs/flutter-apk/BDTrainTracker-v1.0.apk
          if-no-files-found: error
          retention-days: 30
