name: bd_train_tracker
description: "Bangladesh Railway Live Train Tracking & Community Guide"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/hind_siliguri_regular.ttf
        - asset: assets/fonts/hind_siliguri_medium.ttf
          weight: 500
        - asset: assets/fonts/hind_siliguri_semibold.ttf
          weight: 600
        - asset: assets/fonts/hind_siliguri_bold.ttf
          weight: 700
